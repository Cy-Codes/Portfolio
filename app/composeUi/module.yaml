product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - //core
  - //app/presentation
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.decompose
  - $libs.decompose.extensions.compose
  - $libs.decompose.extensions.compose.experimental
  - $libs.compose.material3.adaptive
  - $libs.markdown.renderer.m3
  - $libs.markdown.renderer.code
  - $libs.highlights
  - $libs.kotlinx.datetime

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: codes.cy.portfolio.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
