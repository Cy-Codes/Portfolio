# ============================================================================
# Portfolio Local Infrastructure & Emulation Stack
# Profiles:
#   deps  - PostgreSQL 16 + One-Shot Flyway Migrator + fake-gcs-server (GCS emulator)
#   local - Full local runtime dependencies + containerized public and admin Ktor servers
#   test  - Ephemeral verification dependencies
# ============================================================================

services:
  postgres:
    image: "postgres:${POSTGRES_IMAGE_TAG:-16.8-alpine}"
    profiles: ["deps", "local", "test"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-portfolio}"
      POSTGRES_USER: "${POSTGRES_SUPERUSER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:-dev_postgres_superuser_change_me}"
      PORTFOLIO_MIGRATOR_USER: "${PORTFOLIO_MIGRATOR_USER:-portfolio_migrator}"
      PORTFOLIO_MIGRATOR_PASSWORD: "${PORTFOLIO_MIGRATOR_PASSWORD:-dev_migrator_change_me}"
      PORTFOLIO_ADMIN_USER: "${PORTFOLIO_ADMIN_USER:-portfolio_admin}"
      PORTFOLIO_ADMIN_PASSWORD: "${PORTFOLIO_ADMIN_PASSWORD:-dev_admin_change_me}"
      PORTFOLIO_PUBLIC_USER: "${PORTFOLIO_PUBLIC_USER:-portfolio_public}"
      PORTFOLIO_PUBLIC_PASSWORD: "${PORTFOLIO_PUBLIC_PASSWORD:-dev_public_change_me}"
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/server-db/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_SUPERUSER:-postgres}\" -d \"${POSTGRES_DB:-portfolio}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  db-migrator:
    image: "flyway/flyway:${FLYWAY_IMAGE_TAG:-11.8-alpine}"
    profiles: ["deps", "local", "test"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-portfolio}"
      FLYWAY_USER: "${PORTFOLIO_MIGRATOR_USER:-portfolio_migrator}"
      FLYWAY_PASSWORD: "${PORTFOLIO_MIGRATOR_PASSWORD:-dev_migrator_change_me}"
      FLYWAY_SCHEMAS: "portfolio,analytics"
      FLYWAY_DEFAULT_SCHEMA: "portfolio"
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    volumes:
      - ./server/server-db/resources/db/migrations:/flyway/sql:ro
    command: ["migrate"]

  fake-gcs:
    image: "fsouza/fake-gcs-server:${FAKE_GCS_IMAGE_TAG:-1.52.2}"
    profiles: ["deps", "local", "test"]
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GCS_EMULATOR_PORT:-4443}:4443"
    volumes:
      - gcs_data:/data
    command: ["-scheme", "http", "-port", "4443", "-filesystem-root", "/data", "-public-host", "127.0.0.1:${GCS_EMULATOR_PORT:-4443}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4443/storage/v1/b >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  gcs-init:
    image: "curlimages/curl:${CURL_IMAGE_TAG:-8.12.1}"
    profiles: ["deps", "local", "test"]
    restart: "no"
    depends_on:
      fake-gcs:
        condition: service_healthy
    environment:
      GCS_BUCKET_NAME: "${GCS_BUCKET_NAME:-portfolio-assets}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        status=$$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"name\":\"$${GCS_BUCKET_NAME}\"}" http://fake-gcs:4443/storage/v1/b) &&
        ([ "$${status}" = "200" ] || [ "$${status}" = "409" ])

  server-public:
    build:
      context: .
      dockerfile: server/server-public/Dockerfile
    image: "portfolio-server-public:${APP_IMAGE_TAG:-local-dev}"
    profiles: ["local"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      fake-gcs:
        condition: service_healthy
      gcs-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      PUBLIC_SERVER_HOST: "0.0.0.0"
      PUBLIC_SERVER_PORT: "${PUBLIC_SERVER_PORT:-8080}"
      PUBLIC_SITE_BASE_URL: "${PUBLIC_SITE_BASE_URL:-http://127.0.0.1:8080}"
      ANALYTICS_DAILY_SALT: "${ANALYTICS_DAILY_SALT:-dev-portfolio-analytics-salt}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-portfolio}"
      PORTFOLIO_PUBLIC_USER: "${PORTFOLIO_PUBLIC_USER:-portfolio_public}"
      PORTFOLIO_PUBLIC_PASSWORD: "${PORTFOLIO_PUBLIC_PASSWORD:-dev_public_change_me}"
      GCS_BUCKET_NAME: "${GCS_BUCKET_NAME:-portfolio-assets}"
      GCS_PROJECT_ID: "${GCS_PROJECT_ID:-portfolio-local}"
      STORAGE_EMULATOR_HOST: "http://fake-gcs:4443"
      STORAGE_EMULATOR_PUBLIC_HOST: "${STORAGE_EMULATOR_PUBLIC_HOST:-http://127.0.0.1:4443}"
      WEB_STATIC_DIR: "${WEB_STATIC_DIR:-/app/web-static}"
    volumes:
      - ./build/tasks/_webApp_buildWasmJsAppWasmJsDebug:/app/web-static:ro
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server-admin:
    build:
      context: .
      dockerfile: server/server-admin/Dockerfile
    image: "portfolio-server-admin:${APP_IMAGE_TAG:-local-dev}"
    profiles: ["local"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      fake-gcs:
        condition: service_healthy
      gcs-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      ADMIN_SERVER_HOST: "0.0.0.0"
      ADMIN_SERVER_PORT: "${ADMIN_SERVER_PORT:-8081}"
      DEV_JWT_SECRET: "${DEV_JWT_SECRET:-dev-only-portfolio-hs256-secret-minimum-32-bytes}"
      ADMIN_ALLOWED_SUBJECTS: "${ADMIN_ALLOWED_SUBJECTS:-dev-owner}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-portfolio}"
      PORTFOLIO_ADMIN_USER: "${PORTFOLIO_ADMIN_USER:-portfolio_admin}"
      PORTFOLIO_ADMIN_PASSWORD: "${PORTFOLIO_ADMIN_PASSWORD:-dev_admin_change_me}"
      GCS_BUCKET_NAME: "${GCS_BUCKET_NAME:-portfolio-assets}"
      GCS_PROJECT_ID: "${GCS_PROJECT_ID:-portfolio-local}"
      STORAGE_EMULATOR_HOST: "http://fake-gcs:4443"
      STORAGE_EMULATOR_PUBLIC_HOST: "${STORAGE_EMULATOR_PUBLIC_HOST:-http://127.0.0.1:4443}"
      WEB_STATIC_DIR: "${WEB_STATIC_DIR:-/app/web-static}"
    volumes:
      - ./build/tasks/_webApp_buildWasmJsAppWasmJsDebug:/app/web-static:ro
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${ADMIN_SERVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  gcs_data:
