product: jvm/app

dependencies:
  - //core
  - //server/server-db
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.server.statusPages
  - $ktor.server.resources
  - $ktor.server.auth
  - $libs.ktor.server.auth.jwt
  - $ktor.server.cors
  - $ktor.server.callLogging
  - $ktor.server.defaultHeaders
  - $libs.kotlinx.datetime
  - $libs.logback.classic

settings:
  ktor: enabled
  kotlin:
    serialization: enabled
  jvm:
    mainClass: codes.cy.portfolio.server.admin.ApplicationKt

test-dependencies:
  - $ktor.server.testHost
  - $ktor.client.contentNegotiation
  - $libs.kotlinx.coroutines.test
